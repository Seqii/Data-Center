
name: Deploy Slidev Presentations

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all presentations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"

          if [[ "$repo" == "$owner.github.io" ]]; then
            base="/"
          else
            base="/$repo/"
          fi

          files=(*.md)

          if (( ${#files[@]} == 0 )); then
            echo "No presentations found in decks/"
            exit 1
          fi

          mkdir -p dist

          for file in "${files[@]}"; do
            name="$(basename "$file" .md)"
            echo "Building $name..."

            pnpm exec slidev build "$file" \
              --out "dist/$name" \
              --base "${base}${name}/" \
              --without-notes
          done

          # Generate a homepage linking to every deck
          cat > dist/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>FRC Code Training</title>
            <style>
              body {
                font-family: system-ui, sans-serif;
                max-width: 760px;
                margin: 60px auto;
                padding: 0 24px;
                line-height: 1.6;
              }
              a { color: #2563eb; }
              li { margin: 12px 0; }
            </style>
          </head>
          <body>
            <h1>FRC Code Training</h1>
            <p>Select a presentation:</p>
            <ul>
          HTML

          for file in "${files[@]}"; do
            name="$(basename "$file" .md)"
            printf '      <li><a href="./%s/">%s</a></li>\n' \
              "$name" "$name" >> dist/index.html
          done

          cat >> dist/index.html <<'HTML'
            </ul>
          </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
