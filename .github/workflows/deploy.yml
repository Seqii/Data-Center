
name: Deploy Data Center

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: Slides/FRC Code Training

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Slides/FRC Code Training/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all presentations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"

          if [[ "$repo" == "$owner.github.io" ]]; then
            base="/"
          else
            base="/$repo/"
          fi

          files=()
          for file in *.md; do
            if [[ "$file" != "README.md" ]]; then
              files+=("$file")
            fi
          done

          if (( ${#files[@]} == 0 )); then
            echo "No presentations found in Slides/FRC Code Training/"
            exit 1
          fi

          mkdir -p dist

          for file in "${files[@]}"; do
            name="$(basename "$file" .md)"
            echo "Building $name..."

            pnpm exec slidev build "$file" \
              --out "dist/$name" \
              --base "${base}${name}/" \
              --router-mode hash \
              --without-notes
          done

      - name: Install homepage dependencies
        working-directory: homepage
        run: npm ci --ignore-scripts

      - name: Build Data Center homepage
        working-directory: homepage
        run: npm run build

      - name: Add homepage to website
        run: cp -R ../../homepage/dist/. dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: Slides/FRC Code Training/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
